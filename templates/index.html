<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Caption Generator</title>
    <style>
        :root {
            --bg: #f5efe6;
            --panel: rgba(255, 251, 245, 0.9);
            --ink: #1f2933;
            --muted: #52606d;
            --accent: #b44f2f;
            --accent-dark: #8f3d22;
            --line: rgba(31, 41, 51, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(180, 79, 47, 0.18), transparent 30%),
                radial-gradient(circle at bottom right, rgba(57, 91, 100, 0.18), transparent 25%),
                linear-gradient(135deg, #f7f1e8, #e8ddd0);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(720px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(31, 41, 51, 0.12);
            backdrop-filter: blur(10px);
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.05;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        form {
            margin-top: 28px;
            display: grid;
            gap: 14px;
        }

        input[type="file"] {
            border: 1px dashed var(--line);
            border-radius: 16px;
            padding: 18px;
            background: white;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            cursor: pointer;
        }

        .result {
            margin-top: 24px;
            padding: 18px 20px;
            border-radius: 18px;
            background: white;
            border: 1px solid var(--line);
        }

        .label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .error {
            color: #8a1c1c;
            background: rgba(195, 59, 59, 0.08);
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Image Caption Generator</h1>
        <p>Train the model with <code>python train.py</code>, then upload an image here to generate a caption.</p>

        <form method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <button type="submit">Generate Caption</button>
        </form>

        {% if error %}
            <section class="result error">
                <span class="label">Error</span>
                <strong>{{ error }}</strong>
            </section>
        {% endif %}

        {% if caption %}
            <section class="result">
                <span class="label">Caption</span>
                <strong>{{ caption }}</strong>
            </section>
        {% endif %}
    </main>
</body>
</html>
